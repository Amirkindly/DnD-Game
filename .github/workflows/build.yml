name: Build Adventurers APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Find project (or extract zip)
        run: |
          if [ ! -f package.json ]; then
            ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | sort -V | tail -1)
            [ -z "$ZIP" ] && { echo "ERROR: no package.json and no zip found"; exit 1; }
            echo "Using zip: $ZIP"
            mkdir -p src_unzipped
            unzip -q "$ZIP" -d src_unzipped || true
            rm -rf src_unzipped/__MACOSX
            PKG=$(find src_unzipped -name package.json -not -path "*/node_modules/*" | head -1)
            [ -z "$PKG" ] && { echo "ERROR: package.json not found in zip"; exit 1; }
            echo "PROJECT_DIR=$(cd "$(dirname "$PKG")" && pwd)" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Disable lint tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lint')) { t.enabled = false }
            }
          }
          GRADLE

      - name: Install & create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Customize app (name, portrait, version, gradle speed)
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">ماجراجویان</string>|' app/src/main/res/values/strings.xml
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' app/src/main/AndroidManifest.xml
          sed -i "s|versionCode 1|versionCode ${{ github.run_number }}|; s|versionName \"1.0\"|versionName \"1.0.${{ github.run_number }}\"|" app/build.gradle
          cat >> gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          PROPS

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          OUT="$PROJECT_DIR/android/app/build/outputs/apk/release"
          UNSIGNED=$(ls "$OUT"/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            PASS="android123"; ALIAS="temp"
            keytool -genkeypair -keystore release.jks -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Adventurers"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out Adventurers.apk aligned.apk
          "$BT/apksigner" verify Adventurers.apk
          mkdir -p dist && mv Adventurers.apk dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Adventurers-APK
          path: dist/Adventurers.apk
          if-no-files-found: error
